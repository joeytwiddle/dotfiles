# <Prefix>s lists sessions with more detail than the default; <Prefix>S shows the full session/window/pane tree.
bind-key s choose-tree -s -F '#{session_windows} windows#{?session_attached, (attached),} #{window_name} #{pane_current_path}'
bind-key S choose-tree

# Make PageUp jump into copy-mode immediately. <Prefix><Shift-P> to toggle for window
set -gw @page_up_enters_copy_mode 1
bind-key P if-shell -F '#{@page_up_enters_copy_mode}' \
  'set -w @page_up_enters_copy_mode 0 ; display-message "Disabled PageUp enters copy-mode"' \
  'set -w @page_up_enters_copy_mode 1 ; display-message "Enabled PageUp enters copy-mode"'
bind-key -n PageUp if-shell -F '#{?pane_in_mode,0,#{@page_up_enters_copy_mode}}' \
  'copy-mode -u' \
  'send-keys PageUp'
# Exit copy-mode if we scroll down to the bottom
bind-key -T copy-mode-vi PageDown send-keys -X page-down \; if-shell -F '#{&&:#{==:#{@page_up_enters_copy_mode},1},#{==:#{scroll_position},0}}' 'send-keys -X cancel'
bind-key -T copy-mode PageDown send-keys -X page-down \; if-shell -F '#{&&:#{==:#{@page_up_enters_copy_mode},1},#{==:#{scroll_position},0}}' 'send-keys -X cancel'
