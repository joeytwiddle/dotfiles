# Enable truecolor passthrough when the outer terminal supports it ($COLORTERM is
# set to "truecolor" or "24bit" by iTerm2, kitty, WezTerm, Alacritty, etc.).
#if-shell '[ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]' \
#  'set -g terminal-overrides ",*256col*:Tc"'
# Enable truecolor passthrough when the outer terminal supports it.  TERM cannot tell us
# that — iTerm2 and Terminal.app both report xterm-256color but only one does truecolor —
# so gate on $COLORTERM, which truecolor terminals set, and then apply to any TERM rather
# than guessing at names (kitty is xterm-kitty, Alacritty is alacritty, and so on).
# Caveat: $COLORTERM is read once, from the environment of whichever client first started
# the server, so it is wrong if you later attach from a terminal of the other kind.
if-shell '[ "$COLORTERM" = truecolor ] || [ "$COLORTERM" = 24bit ]' \
  'set -as terminal-features ",*:RGB"'

# When a session is started from a coloured iTerm2 or Konsole tab, tint its status bar to match (at half brightness), else pick a random colour.
# Each session records which terminal tab created it; without this, every session would see the tab that started the server.
run-shell 'for v in ITERM_SESSION_ID KONSOLE_DBUS_SERVICE KONSOLE_DBUS_SESSION; do tmux show -gv update-environment | grep -qx $v || tmux set -ga update-environment $v; done'
set-hook -g session-created 'run-shell -b "~/j/tools/tmux-set-background-color-from-terminal-tab-color #{q:session_id} 2>/dev/null || tmux-set-random-status-bg #{q:session_id} 2>/dev/null || true"'

# Plugins
# Loaded directly rather than via TPM, so options must be set before the run-shell lines.

# Save/restore the whole tmux server: layout, dirs, pane contents, and the processes below.
# The "~x->y *" form matches x anywhere in the saved command and restores as y with the arguments that followed x.
# Matching on "claude --resume" rather than "claude" is deliberate: a pane resuming a known session comes back resuming it, while a pane running plain `claude` is left as a shell, because restoring that would start a NEW session instead of the one that was there.
# The flag has to be repeated after the "->" since it is consumed by the match.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~claude --resume->claude --resume *" "~codex->codex *" "~nvim->nvim *" "~vim->vim *"'
# Panes started via the claude-resume picker are saved as the wrapper, not as the `claude --resume <id>` it runs underneath, so the rule above cannot see them and they come back as shells.  Uncommenting the version below brings the picker back instead, in the right directory — at the cost of every such pane opening an interactive picker at once on restore.
# (Making the wrapper `exec` claude is not an option: it runs claude as a child on purpose, so its EXIT trap can restore the tmux window name and clean up temp files.)
#set -g @resurrect-processes '"~claude --resume->claude --resume *" "~claude-resume->bash $HOME/bin/claude-resume" "~codex->codex *" "~nvim->nvim *" "~vim->vim *"'
# Auto-restore when I start tmux
set -g @continuum-restore 'on'
# Note that `continuum-save-interval` may be overwritten by CTRL-T below anyway.
set -g @continuum-save-interval '10'
# Auto-restore only fires if the plugin loads within this many seconds of the server starting (default 10).
# If that is too short (your tmux starts slowly) then increae this. But note that this increases the risk of double-restore.
# But note that this also increases the risk window of an auto-restore (e.g. if you run a plain `tmux` or reload the config within 30 seconds).
#set -g @continuum-restore-max-delay '30'
# Auto-restore on boot
#set -g @continuum-boot 'on'
#set -g @continuum-boot-options 'iterm'

# Manual save is <prefix>C-s, manual restore <prefix>C-r.
run-shell ~/src/tmux-resurrect/resurrect.tmux
run-shell ~/src/tmux-continuum/continuum.tmux

# Reload plugins (useful after changing any option above)
# Without TPM there is nothing to fetch, so <prefix>I just re-sources the plugins.
bind I run-shell '~/src/tmux-resurrect/resurrect.tmux' \; \
       run-shell '~/src/tmux-continuum/continuum.tmux' \; \
       display-message "tmux plugins re-sourced"

# <Prefix><CTRL-T> Freeze autosave before tearing a session down, so a good save isn't overwritten.
bind C-t if-shell -F '#{==:#{@continuum-save-interval},0}' \
  'set -g @continuum-save-interval 10 ; display-message "Continuum autosave: ON (every 10 min)"' \
  'set -g @continuum-save-interval 0  ; display-message "Continuum autosave: OFF. Last save: #{t:@continuum-save-last-timestamp}"'

#
#
# RUN LAST

# Machine-local overrides (e.g. site-specific settings).  Silently ignored if absent.
source-file -q ~/.tmux.local.conf
