# BEWARE: Do not edit app.conf because that gets overwritten. Edit app.LOCAL_FOCUSED.conf instead.
#
# This is the config file for keyd-application-mapper, which lives in ~/.config/keyd/app.LOCAL_FOCUSED.conf

# Unlike keyd, keyd-application-mapper appears to reload this config automatically when it changes

# NOTE: When this machine is a remote, Synergy appears to bypass keyd, so we cannot remap the keystrokes it sends us :-(

# NOTE: When this machine is the host, these mappings will apply to the remote, based on which app we were using before we move the mouse over to the remote.
#       So, if Alt-V is not pasting on the remote macOS, then you may need to focus a different app on the Linux host, then try again on the remote.

# WARN: Do not uncomment `[ids] *` or all the keybindings below this will apply to all apps
#       This also happens if I put `[ids] *` near the bottom of the file. :think:
#[ids]
#*
# Default behavior if no app match
#[main]

# Moved to device.conf so it will remap BEFORE sending to the MacBook over Synergy
#[*]
#control.[ = macro(C-b p)
#control.] = macro(C-b n)
#control+shift+alt.[ = macro(C-b p)
#control+shift+alt.] = macro(C-b n)
#control+shift+alt.tab = macro(C-b tab)
# TODO BUG: These two binds break CTRL-ALT-Left/Right for workspace navigation
#alt.left = home
#alt.right = end
# And unfortunately these don't succeed in overriding, to restore the original behaviour
#leftcontrol+leftalt.left = C-M-left
#leftcontrol+leftalt.right = C-M-right
#leftcontrol+leftalt.left = C-A-left
#leftcontrol+leftalt.right = C-A-right

[konsole,gnome-terminal,xterm,hyper,code]
#v = S-insert
alt.c = C-S-c
alt.v = S-insert

# Did not work:
#r = C-r
#alt-r = macro(leftalt-release C-r)
# Work:
# firefox-dev, firefox-bin
[firefox*,google-chrome*,chrome*,chromium*]
alt.c = C-c
alt.x = C-x
alt.v = C-v
alt.r = C-r
alt.l = C-l
alt.t = C-t
alt.w = C-w
alt.q = C-q
# Do not use the bind above when pressing ctrl+alt
control+alt.w = C-A-w
