[control+shift]
# These work on Linux, but the [ doesn't work when Synergy sends it to the MacBook
[ = macro(C-b p)
] = macro(C-b n)


[control+shift+alt]
# These work on Linux, but the [ doesn't work when Synergy sends it to the MacBook
[ = macro(C-b p)
] = macro(C-b n)
tab = macro(C-b tab)

